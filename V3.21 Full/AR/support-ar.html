<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rose Studios | الدعم ومقترحات المجتمع</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap');

    :root {
      --bg-dark: #030305;
      --card-bg: rgba(12, 12, 15, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.15);
      --border-active: rgba(34, 197, 94, 0.7);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-green: #22c55e;
      --font-apple: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      background-color: var(--bg-dark);
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-apple);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: slideInFromBottom 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    #globalLoadingScreen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s ease;
    }
    
    .rose-loader-brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-green);
      text-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
      animation: pulseBrand 1.5s ease-in-out infinite alternate;
    }
    
    @keyframes pulseBrand {
      0% { opacity: 0.4; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    .rose-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(34, 197, 94, 0.2);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    .rose-loading-text {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 20px;
    }
    
    .page-content-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: filter 1.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    body.page-exit-blur .page-content-wrapper {
      filter: blur(15px) !important;
      pointer-events: none;
    }
    
    @keyframes slideInFromBottom {
      0% { opacity: 0; transform: translateY(100px); filter: blur(15px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }
    
    .lang-transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 3, 5, 0.75);
      backdrop-filter: blur(0px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, backdrop-filter 0.4s ease;
    }
    
    .lang-transition-overlay.active {
      opacity: 1;
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }
    
    .lang-transition-box {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1px;
      text-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
    }
    
    .lang-transition-overlay.active .lang-transition-box {
      transform: scale(1);
      opacity: 1;
    }
    
    .bg-gradient-overlay {
      position: fixed; 
      inset: 0; 
      z-index: -2;
      background-color: var(--bg-dark);
      overflow: hidden;
    }
    
    .bg-gradient-overlay::before {
      content: '';
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.075) 1.2px, transparent 1.2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.075) 1.2px, transparent 1.2px);
      background-size: 50px 50px;
      animation: gridMove 15s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }
    
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      pointer-events: none;
      animation: orbFloat 7s ease-in-out infinite alternate;
    }
    
    .glow-orb-1 {
      width: 350px;
      height: 350px;
      background: rgba(34, 197, 94, 0.14);
      top: -10%;
      right: 10%;
    }
    
    .glow-orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(140, 140, 180, 0.1);
      bottom: -20%;
      left: 10%;
      animation-delay: -3s;
    }
    
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }
    
    header {
      width: 100%;
      max-width: 1200px;
      margin: 25px auto 20px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .brand-tag {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-green);
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.5), 0 0 40px rgba(34, 197, 94, 0.2);
    }
    
    .social-links-minimal {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .social-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
    }
    
    .social-icon-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
    
    .social-icon-btn:hover {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--accent-green);
      transform: translateY(-2px);
    }
    
    .back-btn, .lang-globe-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      font-family: var(--font-apple);
      cursor: pointer;
    }
    
    .back-btn:hover, .lang-globe-btn:hover {
      border-color: var(--accent-green);
      background: rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }
    
    .lang-globe-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    
    .back-btn .ripple, .lang-globe-btn .ripple, .submit-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.35);
      transform: scale(0);
      pointer-events: none;
    }
    
    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      max-width: 550px;
      text-align: center;
      line-height: 1.5;
      padding: 0 10px;
    }
    
    .support-container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto 0 auto;
      padding: 0 16px;
    }
    
    .support-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      margin-bottom: 30px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }
    
    .form-input, .form-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: var(--font-apple);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s ease;
      text-align: right;
    }
    
    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent-green);
      background: rgba(34, 197, 94, 0.03);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }
    
    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .submit-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: var(--text-main);
      padding: 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font-apple);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
    }
    
    .submit-btn:hover {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
      transform: translateY(-2px);
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    
    .status-msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #4ade80;
    }
    
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
    }
    
    .comments-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }
    
    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .comment-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.3s ease;
    }
    
    .comment-card:hover {
      border-color: rgba(34, 197, 94, 0.3);
    }
    
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .comment-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .comment-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
    }
    
    .comment-username {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }
    
    .comment-status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .status-resolved {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    
    .status-pending {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
    }
    
    .comment-body {
      font-size: 0.85rem;
      color: #d1d5db;
      line-height: 1.4;
      word-break: break-word;
      padding-right: 36px;
    }
    
    .comment-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      padding-right: 36px;
    }
    
    @media (max-width: 768px) {
      .support-card { padding: 20px; }
      .brand-tag { font-size: 1rem; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  <script>
    const SUPABASE_URL = 'https://ahbgpvdzapjcfoakxisj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sYMXlJtRZZukmGZ8CwkVdQ_rq4Upaqv';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loadingScreen = document.getElementById('globalLoadingScreen');
    const loadingStatusText = document.getElementById('loadingStatusText');
    
    const langSwitchBtn = document.getElementById('lang-switch-btn');
    const langTransitionOverlay = document.getElementById('langTransitionOverlay');
    const pageContentWrapper = document.getElementById('pageContentWrapper');
    
    if (langSwitchBtn) {
      langSwitchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');
        if (pageContentWrapper) pageContentWrapper.classList.add('page-exit-blur');
        if (langTransitionOverlay) langTransitionOverlay.classList.add('active');
        setTimeout(() => { window.location.href = targetUrl; }, 550);
      });
    }
    
    async function fetchComplaints() {
      const commentsList = document.getElementById('commentsList');
      
      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => reject(new Error("TIMEOUT")), 8000);
      });
    
      try {
        const fetchPromise = supabaseClient
          .from('support_messages')
          .select('*')
          .eq('is_approved', true) // جلب الرسائل التي وافقت عليها فقط
          .order('created_at', { ascending: false });
    
        const response = await Promise.race([fetchPromise, timeoutPromise]);
        const { data, error } = response;
    
        if (error) throw error;
    
        loadingScreen.style.opacity = '0';
        setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
    
        if (!data || data.length === 0) {
          commentsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">لا توجد مشاركات معتمدة حتى الآن. كن أول من يشاركنا رأيه!</p>`;
          return;
        }
    
        commentsList.innerHTML = '';
        data.forEach(item => {
          const name = item.username ? item.username : 'مستخدم مجهول';
          const initial = name.charAt(0).toUpperCase();
    
          let badgeText = item.status ? item.status : 'معتمد';
          let badgeClass = 'status-resolved';
    
          if (badgeText.toLowerCase() === 'pending') {
            badgeClass = 'status-pending';
            badgeText = 'قيد الانتظار';
          } else {
            badgeText = 'معتمد';
          }
    
          const dateFormatted = new Date(item.created_at).toLocaleDateString('ar-EG', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
    
          const commentCard = document.createElement('div');
          commentCard.className = 'comment-card';
          commentCard.innerHTML = `
            <div class="comment-header">
              <div class="comment-user-info">
                <div class="comment-avatar">${initial}</div>
                <span class="comment-username">${escapeHtml(name)}</span>
              </div>
              <span class="comment-status-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="comment-body">${escapeHtml(item.complaint_text)}</div>
            <div class="comment-time">${dateFormatted}</div>
          `;
          commentsList.appendChild(commentCard);
        });
    
      } catch (err) {
        console.error('Connection/Fetch error:', err);
        loadingStatusText.innerHTML = "<span style='color: #f87171;'>فشل الاتصال بقاعدة البيانات. يرجى التحقق من اتصالك وإعادة التحميل.</span>";
      }
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const form = document.getElementById('supportForm');
    
    submitBtn.addEventListener('click', async function() {
      statusMsg.style.display = 'none';
    
      const usernameVal = document.getElementById('username').value.trim();
      const complaintTextVal = document.getElementById('complaint_text').value.trim();
    
      // التحقق الصارم: منع الإرسال وإظهار تنبيه لو خانة الرسالة فارغة
      if (!complaintTextVal) {
        statusMsg.className = "status-msg error";
        statusMsg.style.display = "block";
        statusMsg.innerText = "يرجى كتابة نص الرسالة أو الشكوى قبل الإرسال.";
        return;
      }
    
      submitBtn.style.pointerEvents = 'none';
      btnText.innerText = "جاري الإرسال...";
      btnIcon.innerHTML = '<span class="spinner"></span>';
    
      const insertData = { 
        complaint_text: complaintTextVal,
        status: 'Pending' 
      };
      
      if (usernameVal !== '') {
        insertData.username = usernameVal;
      }
    
      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => reject(new Error("TIMEOUT")), 8000);
      });
    
      try {
        const supabasePromise = supabaseClient.from('support_messages').insert([insertData]);
        const response = await Promise.race([supabasePromise, timeoutPromise]);
        const error = response.error;
    
        if (error) throw error;
    
        btnText.innerText = "تم الإرسال بنجاح";
        btnIcon.innerHTML = "✓";
        submitBtn.style.backgroundColor = "var(--accent-green)";
        submitBtn.style.color = "#000";
    
        statusMsg.className = "status-msg success";
        statusMsg.style.display = "block";
        statusMsg.innerText = "شكراً لك! تم إرسال رسالتك بنجاح وهي قيد المراجعة.";
        form.reset();
    
        setTimeout(() => {
          btnText.innerText = "إرسال الرسالة";
          btnIcon.innerHTML = "←";
          submitBtn.style.backgroundColor = "";
          submitBtn.style.color = "";
          submitBtn.style.pointerEvents = 'auto';
        }, 2000);
    
      } catch (err) {
        console.error('Submission error:', err);
        
        btnText.innerText = "إرسال الرسالة";
        btnIcon.innerHTML = "←";
        submitBtn.style.pointerEvents = 'auto';
        
        statusMsg.className = "status-msg error";
        statusMsg.style.display = "block";
        if (err.message === "TIMEOUT") {
          statusMsg.innerText = "خطأ: انتهى وقت الانتظار، يرجى التحقق من اتصال الإنترنت.";
        } else {
          statusMsg.innerText = "خطأ: حدثت مشكلة أثناء الاتصال بالخادم.";
        }
      }
    });
    
    fetchComplaints();
  </script>

</body>
</html>
