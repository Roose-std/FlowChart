<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قريباً | روز ستوديوز</title>
  <style>
    /* Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-dark: #030305;
      --card-bg: rgba(10, 10, 13, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-active: rgba(255, 255, 255, 0.5);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-green: #22c55e;
      --font-apple: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html {
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      background-color: var(--bg-dark);
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-apple);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      animation: slideInFromBottom 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes slideInFromBottom {
      0% { opacity: 0; transform: translateY(100px); filter: blur(15px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }
    
    body.page-exiting {
      animation: zoomOutBlur 1s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }
    
    @keyframes zoomOutBlur {
      0% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0px); }
      100% { opacity: 0; transform: scale(0.82) translateZ(0); filter: blur(25px); }
    }
    
    /* Background Effects */
    .bg-gradient-overlay {
      position: fixed; 
      inset: 0; 
      z-index: -2;
      background-color: var(--bg-dark);
      overflow: hidden;
    }
    
    .bg-gradient-overlay::before {
      content: '';
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1.2px, transparent 1.2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1.2px, transparent 1.2px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(60px); }
    }
    
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      pointer-events: none;
      animation: orbFloat 7s ease-in-out infinite alternate;
    }
    
    .glow-orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(34, 197, 94, 0.15);
      top: 10%;
      right: 20%;
      animation-delay: 0s;
    }
    
    .glow-orb-2 {
      width: 350px;
      height: 350px;
      background: rgba(255, 100, 100, 0.12);
      bottom: 15%;
      left: 20%;
      animation-delay: -3s;
    }
    
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, -30px) scale(1.1); }
    }
    
    /* Wrapper Container */
    .wrapper-container {
      position: relative;
      max-width: 650px;
      width: 100%;
      z-index: 1;
    }

    /* Glowing Rotating Border Container */
    .glow-border-box {
      position: relative;
      border-radius: 26px;
      padding: 2px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Rotating Conic Gradient Element */
    .glow-border-box::before {
      content: '';
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg at 50% 50%, 
        transparent 0deg, 
        transparent 310deg, 
        rgba(34, 197, 94, 0.2) 330deg, 
        #22c55e 355deg, 
        #ffffff 360deg
      );
      animation: rotateBorder 8s linear infinite;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Content Container */
    .container {
      width: 100%;
      padding: 3rem;
      background: var(--card-bg);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 2;
    }
    
    /* Heading with Gradient */
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff 0%, #cccccc 40%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    
    /* Paragraph */
    p {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.8;
      font-weight: 400;
      max-width: 550px;
      margin: 0 auto 2.5rem auto;
    }
    
    /* Highlight */
    .highlight {
      color: #ffffff;
      font-weight: 500;
    }
    
    /* Buttons Group */
    .buttons-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    /* Back & Navigation Buttons */
    .nav-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .nav-btn:hover {
      border-color: var(--accent-green);
      background: rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }
    
    .nav-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.35);
      transform: scale(0);
      pointer-events: none;
    }
    
    @keyframes rippleEffect {
      to { transform: scale(4); opacity: 0; }
    }
    
    /* Mobile Adaptation */
    @media (max-width: 768px) {
      .container {
        padding: 2rem;
        border-radius: 16px;
      }
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 1.05rem;
      }
      .buttons-group {
        flex-direction: column;
      }
      .nav-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background Elements -->
  <div class="bg-gradient-overlay">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <!-- Wrapper Container -->
  <div class="wrapper-container">
    
    <!-- Glowing Rotating Border Box -->
    <div class="glow-border-box">
      <!-- Main Content -->
      <div class="container">
        <h1>قريباً</h1>
        <p>
          نحن نجهز شيئاً مميزاً خصيصاً لك. 
          <span class="highlight">الخطط الشهرية الجديدة كلياً</span> و
          <span class="highlight">الخصومات الحصرية</span> في الطريق إليك.
        </p>

        <!-- Navigation Buttons -->
        <div class="buttons-group">
          <a href="Home-ar.html" class="nav-btn">
            <span class="ripple"></span>
            <span>العودة للرئيسية ←</span>
          </a>
          <a href="price-ar.html" class="nav-btn">
            <span class="ripple"></span>
            <span>الأسعار والخطط →</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // General Page Transition & Ripple Effect for links
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');
        if (!targetUrl || targetUrl.startsWith('#')) return;

        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const ripple = this.querySelector('.ripple');
        if (ripple) {
          const diameter = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = `${diameter}px`;
          ripple.style.left = `${x - diameter / 2}px`;
          ripple.style.top = `${y - diameter / 2}px`;
          ripple.style.animation = 'rippleEffect 0.6s linear';
        }
        
        document.body.classList.add('page-exiting');
        setTimeout(() => { 
          window.location.href = targetUrl; 
        }, 950);
      });
    });
  </script>
</body>
</html>
