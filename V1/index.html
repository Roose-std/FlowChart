<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rose Studios | Select Language</title>
  
  <!-- تضمين مكتبة أيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-dark: #030305;
      --card-bg: rgba(12, 12, 15, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-active: rgba(34, 197, 94, 0.6);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-green: #22c55e;
      --accent-green-glow: rgba(34, 197, 94, 0.4);
      --font-apple: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      background-color: var(--bg-dark);
      overflow: hidden;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-apple);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: filter 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    body.page-exiting {
      filter: blur(25px);
      transform: translateY(40px) scale(0.96);
      opacity: 0;
    }
    
    /* Improved Splash Screen Styles */
    #splash-screen {
      position: fixed; 
      inset: 0; 
      z-index: 9999;
      background: var(--bg-dark); 
      display: flex;
      justify-content: center; 
      align-items: center;
      direction: ltr !important;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
    }
    
    #splash-screen.slide-up { 
      transform: translate3d(0, -100%, 0); 
      opacity: 0.9;
    }
    
    .splash-content-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .splash-text-container { 
      display: flex; 
      gap: 18px; 
      padding: 20px; 
    }
    
    .splash-word-wrapper { 
      overflow: hidden; 
      padding: 10px 5px; 
    }
    
    .splash-word {
      display: inline-block; 
      font-size: 2.6rem; 
      font-weight: 800;
      letter-spacing: 6px; 
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0; 
      transform: translate3d(0, 120%, 0); 
      filter: blur(15px);
      animation: wordUpClean 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .splash-word.highlight {
      color: var(--accent-green);
      text-shadow: 0 0 25px var(--accent-green-glow);
    }
    
    .splash-word-wrapper:nth-child(1) .splash-word { 
      animation-delay: 0.2s; 
    }
    
    .splash-word-wrapper:nth-child(2) .splash-word { 
      animation-delay: 0.5s; 
    }

    /* Splash Loading Bar Animation */
    .splash-loader-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: fadeInBar 0.8s ease forwards 0.9s;
    }

    .splash-loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green-glow);
      animation: progressFill 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
    }

    @keyframes wordUpClean {
      100% { 
        opacity: 1; 
        transform: translate3d(0, 0, 0); 
        filter: blur(0px); 
      }
    }

    @keyframes fadeInBar {
      to { opacity: 1; }
    }

    @keyframes progressFill {
      to { width: 100%; }
    }
    
    /* Background Grids & Glowing Orbs matching other pages */
    .bg-gradient-overlay {
      position: fixed; 
      inset: 0; 
      z-index: -2;
      background-color: var(--bg-dark);
      overflow: hidden;
    }
    
    .bg-gradient-overlay::before {
      content: '';
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1.2px, transparent 1.2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1.2px, transparent 1.2px);
      background-size: 50px 50px;
      animation: gridMove 15s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }
    
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      pointer-events: none;
      animation: orbFloat 7s ease-in-out infinite alternate;
    }
    
    .glow-orb-1 {
      width: 350px;
      height: 350px;
      background: rgba(34, 197, 94, 0.15);
      top: -10%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .glow-orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(140, 140, 180, 0.08);
      bottom: -20%;
      right: 10%;
      animation-delay: -3s;
    }
    
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }
    
    .lang-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      padding: 45px 55px;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }
    
    .lang-title {
      font-size: 0.82rem;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: titleFadeBlur 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-delay: 2.1s;
    }
    
    @keyframes titleFadeBlur {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }
    
    .lang-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    
    .lang-btn {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 14px 36px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, filter, border-color, color;
      opacity: 0;
    }
    
    .btn-ar {
      animation: slideInRight 2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
      animation-delay: 2.2s;
    }
    
    .btn-en {
      animation: slideInLeft 2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
      animation-delay: 2.2s;
    }
    
    @keyframes slideInRight {
      0% { opacity: 0; transform: translateX(250px); filter: blur(12px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0px); }
    }
    
    @keyframes slideInLeft {
      0% { opacity: 0; transform: translateX(-250px); filter: blur(12px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0px); }
    }
    
    .lang-btn:hover {
      border-color: var(--accent-green);
      color: var(--text-main);
      background: rgba(34, 197, 94, 0.08);
      box-shadow: 0 0 20px var(--accent-green-glow);
      transform: translateY(-2px);
    }

    /* Floating Social Icons Styles */
    .social-float-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 999;
      display: flex;
      gap: 12px;
    }

    .social-float-icon {
      width: 50px;
      height: 50px;
      background: rgba(12, 12, 15, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      font-size: 1.25rem;
      text-decoration: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-float-icon:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 20px var(--accent-green-glow);
      transform: translateY(-4px) scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Enhanced Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content-box">
      <div class="splash-text-container">
        <div class="splash-word-wrapper"><span class="splash-word">ROSE</span></div>
        <div class="splash-word-wrapper"><span class="splash-word highlight">STUDIOS</span></div>
      </div>
      <div class="splash-loader-bar">
        <div class="splash-loader-progress"></div>
      </div>
    </div>
  </div>

  <!-- Background Grids & Glowing Orbs -->
  <div class="bg-gradient-overlay">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <div class="lang-container">
    <div class="lang-title">Choose Language / اختر اللغة</div>
    <div class="lang-buttons">
      <a href="Home-ar.html" class="lang-btn btn-ar" data-transition>العربية</a>
      <a href="Home-en.html" class="lang-btn btn-en" data-transition>English</a>
    </div>
  </div>

  <!-- Floating Social Icons (Instagram & Facebook) -->
  <div class="social-float-container">
    <a href="https://www.instagram.com/roose_studios/" target="_blank" class="social-float-icon" title="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.facebook.com/profile.php?id=61592155025162" target="_blank" class="social-float-icon" title="Facebook">
      <i class="fab fa-facebook-f"></i>
    </a>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      setTimeout(() => {
        splash.classList.add('slide-up');
      }, 1900);

      // الانتقال السلس عند اختيار اللغة
      const transitionButtons = document.querySelectorAll('a[data-transition]');
      transitionButtons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const targetUrl = this.getAttribute('href');
    
          document.body.classList.add('page-exiting');
    
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 700);
        });
      });
    });
  </script>

</body>
</html>
