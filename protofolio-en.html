<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Network | Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-dark: #050507;
      --card-bg: rgba(12, 12, 15, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-active: rgba(255, 255, 255, 0.6);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      background-color: var(--bg-dark);
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-apple);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
      
      animation: entryBlur 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: filter, opacity, transform;
    }
    
    @keyframes entryBlur {
      0% {
        opacity: 0;
        filter: blur(20px);
        transform: scale(1.03);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }
    
    body.page-exit-down {
      animation: slideExitDown 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards !important;
    }
    
    @keyframes slideExitDown {
      0% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        transform: translateY(80px);
        opacity: 0;
        filter: blur(10px);
      }
    }
    
    .bg-gradient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: 
        radial-gradient(circle at 80% 20%, rgba(70, 70, 75, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(55, 55, 60, 0.12) 0%, transparent 40%),
        #050507;
      filter: blur(40px);
    }
    
    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      border-color: var(--border-active);
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-3px);
    }
    
    .brand-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    
    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      text-align: center;
    }
    
    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 500px;
      text-align: center;
      line-height: 1.6;
    }


    .filter-container {
      position: relative;
      display: inline-flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 5px;
      border-radius: 40px;
      backdrop-filter: blur(12px);
      gap: 4px;
      margin: 40px 0;
      z-index: 5;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    .active-indicator {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 0;
      width: 0;
      background: #ffffff;
      border-radius: 30px;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
    }
    
    .filter-btn {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-family: var(--font-apple);
      font-weight: 500;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      transition: color 0.3s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    
    .filter-btn:hover {
      color: var(--text-main);
    }
    
    .filter-btn.active {
      color: #000000;
      font-weight: 600;
    }
    
    .filter-btn.clicked-effect {
      animation: tabClickPulse 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes tabClickPulse {
      0% {
        transform: scale(1);
        filter: blur(0px);
      }
      35% {
        transform: scale(0.88);
        filter: blur(1.5px);
      }
      100% {
        transform: scale(1);
        filter: blur(0px);
      }
    }


    .portfolio-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      min-height: 500px;
    }
    
    .portfolio-card {
      width: calc(33.333% - 17px);
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 1s cubic-bezier(0.16, 1, 0.3, 1), 
                  filter 1s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
      will-change: transform, opacity, filter;
    }
    
    .portfolio-card.card-hidden {
      opacity: 0;
      filter: blur(20px);
      pointer-events: none;
    }
    
    .portfolio-card:hover {
      border-color: var(--border-active);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    
    .card-media {
      position: relative;
      width: 100%;
      height: 220px;
      background: #0d0d12;
      overflow: hidden;
    }
    
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    
    .portfolio-card:hover .card-media img { transform: scale(1.05); }
    
    .media-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(12, 12, 15, 0.9) 0%, transparent 60%);
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    
    .category-badge {
      font-size: 0.7rem;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      color: #d1d1d6;
    }
    
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 14px;
      margin-top: auto;
    }
    
    .view-project-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-main);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    
    .view-project-btn:hover { opacity: 0.7; }
    
    @media (max-width: 900px) {
      .portfolio-card { width: calc(50% - 12.5px); }
    }
    
    @media (max-width: 600px) {
      .portfolio-card { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="bg-gradient-overlay"></div>

  <header>
    <div class="top-nav">
      <a href="Home-en.html" class="back-btn" id="back-to-home-btn">
        <span>←</span>
        <span>Home</span>
      </a>
      <div class="brand-tag">Rose studio</div>
    </div>

    <h1 class="page-title">Portfolio</h1>
    <p class="page-subtitle">Explore our latest work in cinematic editing, visual effects.</p>


    <div class="filter-container" id="filterContainer">
      <div class="active-indicator" id="activeIndicator"></div>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="gaming">Gaming Edits</button>
      <button class="filter-btn" data-filter="soon">Coming Soon...</button>
    </div>
  </header>


  <main class="portfolio-grid" id="portfolioGrid">


    <article class="portfolio-card" data-category="gaming">
      <div class="card-media">
        <img src="thumb1.png" alt="pubg mobile editing">
        <div class="media-overlay">
          <span class="category-badge">Gaming Edits</span>
        </div>
      </div>
      <div class="card-body">
        <h2 class="card-title">PUBG Mobile Editing</h2>
        <div class="card-footer">
          <span style="font-size: 0.75rem; color: var(--text-muted);">After Effects</span>
          <a href="Project-1-en.html" class="view-project-btn">
            <span>View Project</span>
            <span>→</span>
          </a>
        </div>
      </div>
    </article>

  </main>

  <script>
    const filterContainer = document.getElementById('filterContainer');
    const indicator = document.getElementById('activeIndicator');
    const buttons = document.querySelectorAll('.filter-btn');
    const cards = Array.from(document.querySelectorAll('.portfolio-card'));
    const grid = document.getElementById('portfolioGrid');

    function updateIndicator(activeBtn) {
      const containerRect = filterContainer.getBoundingClientRect();
      const btnRect = activeBtn.getBoundingClientRect();
      const leftPos = btnRect.left - containerRect.left;
      const width = btnRect.width;
    
      indicator.style.left = `${leftPos}px`;
      indicator.style.width = `${width}px`;
    }
    
    function layoutGrid(filterValue) {
      let cardWidth = cards.length > 0 ? cards[0].offsetWidth : 300;
      let gap = 25;
      
      let columns = 3;
      if (window.innerWidth <= 600) {
        columns = 1;
      } else if (window.innerWidth <= 900) {
        columns = 2;
      }
    
      let visibleIndex = 0;
      let maxHeight = 0;
    
      cards.forEach(card => {
        const cardCategory = card.getAttribute('data-category');
        const isMatch = (filterValue === 'all' || cardCategory === filterValue);
    
        if (isMatch) {
          card.classList.remove('card-hidden');
          
          let col = visibleIndex % columns;
          let row = Math.floor(visibleIndex / columns);
    
          let targetX = col * (cardWidth + gap);
          let targetY = row * (card.offsetHeight + gap);
    
          card.dataset.targetX = targetX;
          card.dataset.targetY = targetY;
    
          card.style.transform = `translate(${targetX}px, ${targetY}px)`;
          
          let currentBottom = targetY + card.offsetHeight;
          if (currentBottom > maxHeight) {
            maxHeight = currentBottom;
          }
    
          visibleIndex++;
        } else {
          card.classList.add('card-hidden');
        }
      });
    
      grid.style.height = `${maxHeight + 40}px`;
    }
    
    window.addEventListener('load', () => {
      const activeBtn = document.querySelector('.filter-btn.active');
      if (activeBtn) {
        indicator.style.transition = 'none';
        updateIndicator(activeBtn);
        setTimeout(() => {
          indicator.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
        }, 50);
      }
      layoutGrid('all');
    });
    
    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector('.filter-btn.active');
      if (activeBtn) updateIndicator(activeBtn);
      const currentFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
      layoutGrid(currentFilter);
    });
    
    buttons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    
        btn.classList.remove('clicked-effect');
        void btn.offsetWidth;
        btn.classList.add('clicked-effect');
    
        updateIndicator(btn);
    
        const filterValue = btn.getAttribute('data-filter');
        layoutGrid(filterValue);
      });
    });
    
    const backBtn = document.getElementById('back-to-home-btn');
    if (backBtn) {
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');
        document.body.classList.add('page-exit-down');
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 450);
      });
    }
  </script>

</body>
</html>
