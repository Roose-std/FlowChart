<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Production Workflow</title>
  <!-- ربط ملف الـ CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mindmap-container">
    <h1 class="main-title">🎬 Video Production Workflow</h1>
    
    <div class="workflow-grid">
      <!-- Pre-Production -->
      <div class="card pre-prod">
        <div class="card-header">
          <span class="icon">📝</span>
          <h2>1. Pre-Production</h2>
        </div>
        <ul class="card-list">
          <li>Scripting & Concept</li>
          <li>Storyboarding</li>
          <li>Asset Gathering</li>
        </ul>
      </div>

      <!-- Production -->
      <div class="card prod">
        <div class="card-header">
          <span class="icon">🎥</span>
          <h2>2. Production</h2>
        </div>
        <ul class="card-list">
          <li>Camera & Shooting</li>
          <li>Lighting Setup</li>
          <li>Audio Recording</li>
        </ul>
      </div>

      <!-- Post-Production -->
      <div class="card post-prod">
        <div class="card-header">
          <span class="icon">⚡</span>
          <h2>3. Post-Production</h2>
        </div>
        <ul class="card-list">
          <li>Cuts & Beat Sync</li>
          <li>VFX & 3D Tracking</li>
          <li>Color Grading</li>
          <li>SFX & Audio Polish</li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
