<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Studios | Select Language</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-dark: #050507;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans Arabic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      background-color: var(--bg-dark);
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-apple);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: filter 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    body.page-exiting {
      filter: blur(25px);
      transform: translateY(40px) scale(0.96);
      opacity: 0;
    }
    
    /* Splash Screen Styles */
    #splash-screen {
      position: fixed; 
      inset: 0; 
      z-index: 9999;
      background: #050507; 
      display: flex;
      justify-content: center; 
      align-items: center;
      direction: ltr !important;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
    }
    
    #splash-screen.slide-up { 
      transform: translate3d(0, -100%, 0); 
    }
    
    .splash-text-container { 
      display: flex; 
      gap: 20px; 
      padding: 40px; 
    }
    
    .splash-word-wrapper { 
      overflow: hidden; 
      padding: 10px 5px; 
    }
    
    .splash-word {
      display: inline-block; 
      font-size: 2.8rem; 
      font-weight: 600;
      letter-spacing: 8px; 
      text-transform: uppercase;
      opacity: 0; 
      transform: translate3d(0, 110%, 0); 
      filter: blur(10px);
      animation: wordUpClean 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .splash-word-wrapper:nth-child(1) .splash-word { 
      animation-delay: 0.2s; 
    }
    
    .splash-word-wrapper:nth-child(2) .splash-word { 
      animation-delay: 0.5s; 
    }
    
    @keyframes wordUpClean {
      100% { 
        opacity: 1; 
        transform: translate3d(0, 0, 0); 
        filter: blur(0px); 
      }
    }
    
    
    .bg-gradient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: 
        radial-gradient(circle at 100% 0%, rgba(70, 70, 75, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(55, 55, 60, 0.1) 0%, transparent 50%),
        #050507;
      filter: blur(40px);
    }
    
    .lang-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      z-index: 1;
    }
    
    .lang-title {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: titleFadeBlur 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-delay: 2.1s;
    }
    
    @keyframes titleFadeBlur {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }
    
    .lang-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    
    .lang-btn {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 14px 32px;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 1px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, filter, border-color, color;
      opacity: 0;
    }
    
    .btn-ar {
      animation: slideInRight 2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
      animation-delay: 2.2s;
    }
    
    .btn-en {
      animation: slideInLeft 2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
      animation-delay: 2.2s;
    }
    
    @keyframes slideInRight {
      0% { opacity: 0; transform: translateX(250px); filter: blur(12px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0px); }
    }
    
    @keyframes slideInLeft {
      0% { opacity: 0; transform: translateX(-250px); filter: blur(12px); }
      100% { opacity: 1; transform: translateX(0); filter: blur(0px); }
    }
    
    .lang-btn:hover {
      border-color: var(--border-active);
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.02);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>


  <div id="splash-screen">
    <div class="splash-text-container">
      <div class="splash-word-wrapper"><span class="splash-word">ROSE</span></div>
      <div class="splash-word-wrapper"><span class="splash-word">STUDIOS</span></div>
    </div>
  </div>

  <div class="bg-gradient-overlay"></div>

  <div class="lang-container">
    <div class="lang-title">Choose Language / اختر اللغة</div>
    <div class="lang-buttons">
      <a href="Home-ar.html" class="lang-btn btn-ar" data-transition>العربية</a>
      <a href="Home-en.html" class="lang-btn btn-en" data-transition>English</a>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');
      setTimeout(() => {
        splash.classList.add('slide-up');
      }, 1800);

      // تقليل زمن الخروج والانتقال إلى الصفحة الجديدة ليصبح 0.7 ثانية
      const transitionButtons = document.querySelectorAll('a[data-transition]');
      transitionButtons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const targetUrl = this.getAttribute('href');
    
          document.body.classList.add('page-exiting');
    
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 700); // 0.7 ثانية
        });
      });
    });
  </script>

</body>
</html>
